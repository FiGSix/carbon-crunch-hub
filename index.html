    <!-- Defer Vite-injected CSS to prevent render blocking -->
    <script>
      // Make Vite CSS load asynchronously to improve FCP
      (function() {
        // Function to make a stylesheet async
        function makeAsync(link) {
          if (link.nodeName === 'LINK' && link.rel === 'stylesheet' && 
              link.href && link.href.includes('/css/index-') && 
              (!link.media || link.media === 'all' || link.media === 'screen')) {
            link.media = 'print';
            link.addEventListener('load', function() {
              this.media = 'all';
            }, { once: true });
          }
        }
        
        // Check existing stylesheets immediately
        var existingLinks = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < existingLinks.length; i++) {
          makeAsync(existingLinks[i]);
        }
        
        // Observe for new stylesheets
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              makeAsync(node);
            });
          });
        });
        
        observer.observe(document.head, { childList: true, subtree: true });
        
        // Disconnect observer after page load
        window.addEventListener('load', function() {
          observer.disconnect();
        });
      })();
    </script>
