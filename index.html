      (function() {
        var processed = {};

        function makeAsync(link) {
          if (!link || link.nodeName !== 'LINK' || link.rel !== 'stylesheet') return;

          if (href.includes('/css/index-') || href.includes('/assets/')) {
            if (!link.media || link.media === 'all' || link.media === 'screen') {
              processed[link.href] = true;
              var originalMedia = link.media || 'all';
              link.media = 'print';
              link.onload = function() {
                this.media = originalMedia;
                this.onload = null;
